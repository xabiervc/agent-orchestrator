[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Provider-agnostic orchestration core for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent = "agent_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["agent_orchestrator*", "plugins*", "game_production*"]
